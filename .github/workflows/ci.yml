name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run unit
      - run: npm run check-card
      - name: Generated tests are committed and reproducible
        run: |
          npm run generate
          npm run generate
          git diff --exit-code examples/fooddash/tests.json examples/fooddash/tests.md
      - name: A changed card is not approved any more
        run: |
          sed -i 's/"boundary": 2000/"boundary": 1500/' examples/fooddash/fact-card.json
          if npm run generate 2> refused.log; then echo "the generator accepted a card that changed after approval"; exit 1; fi
          grep -q "changed after it was approved" refused.log
          git checkout examples/fooddash/fact-card.json
      - run: npx playwright install --with-deps chromium
      - name: The tests find every planted defect
        shell: bash
        run: |
          set -o pipefail
          npm run tests | tee run.log
          for line in "battle  run 22, passed 9, failed 13 · planted defects found 5/5" "learn   run 9, passed 4, failed 5 · planted defects found 2/2" "bug     run 9, passed 1, failed 8 · planted defects found 5/5"; do grep -qF "$line" run.log || { echo "missing in the run output: $line"; exit 1; }; done
